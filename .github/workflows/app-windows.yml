# Windows-Testversion: baut einen Installer (.exe, nicht signiert) und legt ihn
# neben die Mac-DMG in die Vorabversion "app-latest". Nur von Hand gestartet.
# tauri.windows.conf.json ersetzt die Mac-Fenstereinstellungen (Glas, Ampel).
name: App Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten
        working-directory: app
        run: npm ci

      - name: App bauen
        working-directory: app
        run: npx tauri build --bundles nsis

      - name: Dateien einsammeln
        id: out
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp app/src-tauri/target/release/bundle/nsis/*.exe "dist/Archiver-$VERSION-windows-x64-setup.exe"
          ls -la dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: archiver-windows
          path: dist/*

      - name: Vorabversion ergänzen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=app-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Archiver App (Testversion)" --notes "Testversion" --target "$GITHUB_SHA"
          gh release upload "$TAG" dist/* --clobber
